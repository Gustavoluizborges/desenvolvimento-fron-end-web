<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes em CSS - Cardápio da Cantina</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <h1>Cardápio da Cantina</h1>
    <p class="subtitulo">Exercício sobre seletores de classe em CSS</p>
  </header>

  <main class="conteudo">
    <h2>Lanches</h2>
    <p class="item">Pão de queijo <span class="preco">R$ 5,00</span></p>
    <p class="item destaque">Misto quente <span class="preco">R$ 9,00</span></p>
    <p class="item">Coxinha <span class="preco">R$ 7,00</span></p>

    <h2>Bebidas</h2>
    <p class="item">Suco natural <span class="preco">R$ 8,00</span></p>
    <p class="item destaque">Café com leite <span class="preco">R$ 4,50</span></p>

    <p class="aviso">Itens em destaque são as promoções do dia.</p>
  </main>

  <footer class="rodape">
    <p>Exercício 4 - Desenvolvimento Front-End para Web.</p>
  </footer>
</body>
</html>
