<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="painel">
    <h1>Contador</h1>
    <p id="numero" class="numero">0</p>
    <p id="mensagem" class="mensagem">Use os botões para alterar o valor.</p>

    <div class="botoes">
      <button type="button" id="botao-diminuir">- 1</button>
      <button type="button" id="botao-zerar">Zerar</button>
      <button type="button" id="botao-aumentar">+ 1</button>
    </div>
  </main>
</body>
</html>
